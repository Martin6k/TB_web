name: CI

# Cada push y cada pull request corren las pruebas de todas las piezas. Ninguna
# necesita base de datos: las de los servicios son unitarias (JUnit y Mockito,
# con los repositorios simulados) y de controlador (@WebMvcTest). Las de
# rendimiento viven en rendimiento/ y necesitan el sistema arriba.
on:
  push:
  pull_request:

jobs:
  java:
    name: Servicios Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '25'
          cache: maven
      - name: common, gateway, ms-auth, ms-debt y ms-payments
        run: mvn -B test

  asistente:
    name: Asistente (ms-ai)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # El motor local solo usa la biblioteca estandar: no hace falta instalar nada.
      - run: python -m unittest discover tests -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  seguridad:
    name: Dependencias vulnerables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Rompe el build si hay algo de severidad alta o critica. Lo moderado se
      # revisa por Dependabot, que abre un pull request: no tiene sentido
      # bloquear a todo el equipo por algo que no es explotable hoy.
      - name: npm audit del portal
        working-directory: frontend
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: pip-audit del asistente
        run: |
          pip install pip-audit
          pip-audit -r ms-ai/requirements.txt

      # Maven no se audita aca a proposito: OWASP dependency-check necesita una
      # clave de la API del NVD y agrega varios minutos a cada push. Esa capa la
      # cubren Dependabot (.github/dependabot.yml) y CodeQL (codeql.yml).
