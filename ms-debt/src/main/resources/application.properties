# =============================================================================
#  ms-debt
# =============================================================================
#  Todo sale de variables de entorno, con un valor por omision de desarrollo.
#  Perfiles:  dev  (registro detallado y SQL visible)   test  (pruebas)
# =============================================================================

spring.application.name=ms-debt
server.port=${PORT:8083}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
#  Detras del gateway: los enlaces de HATEOAS salen con la direccion publica.
server.forward-headers-strategy=framework
spring.jmx.enabled=false

#  La cartera en CSV se sube desde el portal.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- Base de datos: MySQL, con el esquema en manos de Flyway -----------------
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3308}/${DB_NAME:tb_debt}?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:tbridge}
spring.datasource.password=${DB_PASSWORD:tbridge_pass}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
#  validate: si las entidades y las tablas dejan de calzar, el servicio no
#  arranca, en vez de alterar la base en silencio.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago
#  Cifra en la base el secreto de las suscripciones (config/Cifrado.java). No
#  se guarda en la base. Si se cambia, los suscritos tienen que volver a
#  suscribirse para recibir un secreto nuevo.
app.cifrado.llave=${CIFRADO_LLAVE:databridge-cifrado-dev-cambiar}

# ---- JSON ---------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---- Avisos de pago: por HTTP, o por RabbitMQ si EVENTS_RABBIT=true ---------
#  De esta propiedad dependen la cola, el listener y su indicador de salud.
events.rabbit=${EVENTS_RABBIT:false}
spring.rabbitmq.host=${RABBIT_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}
spring.rabbitmq.connection-timeout=2000
spring.rabbitmq.listener.simple.auto-startup=${EVENTS_RABBIT:false}
spring.rabbitmq.listener.simple.missing-queues-fatal=false
management.health.rabbit.enabled=${EVENTS_RABBIT:false}

# ---- Secretos y direcciones ----------------------------------------------------
#  El mismo que ms-auth: aqui solo se verifica el JWT.
jwt.secret=${JWT_SECRET:tbridge-dev-secret-change-me-32chars}
app.internal-key=${INTERNAL_KEY:tbridge-internal-dev}
#  ms-auth: para emitir el codigo de acceso cuando la empresa lo pide.
app.auth-url=${AUTH_URI:http://127.0.0.1:8081}

# ---- Quien atiende el contrato ---------------------------------------------------
#  Lo que GET /api/v1/cuenta le dice a quien se conecta: con quien quedo conectado.
app.receptor.nombre=${RECEPTOR_NOMBRE:DataBridge}
app.receptor.rut=${RECEPTOR_RUT:}

# ---- Alcance: solo deudores morosos --------------------------------------------
#  Una deuda entra a cobranza cuando su cargo impago mas antiguo lleva al menos
#  estos dias vencido al corte. Con menos, se rechaza sola con el codigo
#  bajo_umbral_mora. En dias y no en meses: sirve para cualquier rubro.
app.cartera.min-dias-mora=${MIN_DIAS_MORA:30}

# ---- Recordatorios de cuota -----------------------------------------------------
#  Cuantos dias antes de que venza una cuota le llega al deudor el correo que
#  se la recuerda, y cuando pasa la tarea (todos los dias a las 9:00 de Chile).
app.recordatorios.dias-antes=${RECORDATORIO_DIAS_ANTES:3}
app.recordatorios.cron=${RECORDATORIO_CRON:0 0 9 * * *}

# ---- Datos de la demo ------------------------------------------------------------
#  Los deudores de ejemplo, cada uno en una situacion distinta. Al arrancar se
#  agregan los que falten, sin tocar lo demas. Fuera de una demo: false. La
#  agencia (APOFYX) se registra igual; los acreedores llegan con su mandato.
app.demo.datos=${DEMO_DATOS:true}

# ---- Eventos v1 (contrato 3) ---------------------------------------------------
#  Cada cuanto se revisa la bandeja de eventos por entregar.
app.eventos.intervalo-ms=${EVENTOS_INTERVALO_MS:15000}
#  El avance de las campanas, todos los dias a las 8:00 de Chile.
app.eventos.avance-cron=${AVANCE_CRON:0 0 8 * * *}

# ---- Salud y documentacion ----------------------------------------------------
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
app.openapi.url-interna=${OPENAPI_URL_INTERNA:http://localhost:8083}

logging.level.com.tbridge=INFO
