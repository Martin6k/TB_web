# =============================================================================
#  ms-payments
# =============================================================================
#  Todo sale de variables de entorno, con un valor por omision de desarrollo.
#  Perfiles:  dev  (registro detallado y SQL visible)   test  (pruebas)
# =============================================================================

spring.application.name=ms-payments
server.port=${PORT:8084}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
#  Detras del gateway: los enlaces de HATEOAS salen con la direccion publica.
server.forward-headers-strategy=framework
spring.jmx.enabled=false

# ---- Base de datos: MySQL, con el esquema en manos de Flyway -----------------
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3308}/${DB_NAME:tb_payments}?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:tbridge}
spring.datasource.password=${DB_PASSWORD:tbridge_pass}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
#  validate: si las entidades y las tablas dejan de calzar, el servicio no
#  arranca, en vez de alterar la base en silencio.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago

# ---- JSON ---------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
#  Un campo que no existe se rechaza con 400, no se ignora: en un cobro, un
#  campo mal nombrado que se ignora cambia lo que se cobra (CheckoutRequest).
#  Los avisos de las pasarelas lo toleran por su cuenta (WebhookRequest).
spring.jackson.deserialization.fail-on-unknown-properties=true

# ---- Avisos a ms-debt: por HTTP, o por RabbitMQ si EVENTS_RABBIT=true -------
events.rabbit=${EVENTS_RABBIT:false}
spring.rabbitmq.host=${RABBIT_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}
spring.rabbitmq.connection-timeout=2000
#  Este servicio publica y no escucha: nada que arrancar.
spring.rabbitmq.listener.simple.auto-startup=false
#  Sin RabbitMQ en uso, su estado no cuenta para la salud del servicio.
management.health.rabbit.enabled=${EVENTS_RABBIT:false}
#  Cada cuanto se revisa la bandeja de avisos pendientes.
app.dispatch-interval-ms=${DISPATCH_INTERVAL_MS:15000}

# ---- Secretos y direcciones ----------------------------------------------------
#  El mismo que ms-auth: aqui solo se verifica el JWT.
jwt.secret=${JWT_SECRET:tbridge-dev-secret-change-me-32chars}
app.internal-key=${INTERNAL_KEY:tbridge-internal-dev}
app.webhook-secret=${WEBHOOK_SECRET:tbridge-webhook-dev}
app.public-url=${PUBLIC_URL:http://localhost:5173}
app.debt-url=${DEBT_URI:http://127.0.0.1:8083}

# ---- Khipu ------------------------------------------------------------------
#  Con KHIPU_LLAVE, Khipu cobra de verdad: el deudor paga con una transferencia
#  en la pagina de Khipu. La llave es la de una cuenta de cobro; con una en
#  modo desarrollador los bancos y la plata son de mentira (DemoBank). Sin
#  llave, Khipu queda simulada.
#  La llave es un SECRETO: va solo en el .env, nunca en el repositorio.
app.khipu.url=${KHIPU_URL:https://payment-api.khipu.com}
app.khipu.llave=${KHIPU_LLAVE:}
#  El aviso de Khipu necesita una direccion publica de DataBridge (en local,
#  Khipu no llega). Vacia, no se pide aviso: los pagos se concilian
#  preguntandole a Khipu cada 30 segundos y al volver el deudor. El secreto
#  de la cuenta de cobro verifica la firma de esos avisos.
app.khipu.url-avisos=${KHIPU_URL_AVISOS:}
app.khipu.secreto=${KHIPU_SECRETO:}
#  Un cobro de Khipu sin pagar despues de esto queda vencido, en Khipu y aca.
app.khipu.vence-en=${KHIPU_VENCE_EN:30m}

# ---- La UF desde el Banco Central (decision I10) ----------------------------
#  Usuario y clave se obtienen registrandose en si3.bcentral.cl. Vacios = la
#  UF se carga a mano con POST /internal/uf.
app.uf.bcentral-url=${BCENTRAL_URL:https://si3.bcentral.cl/SieteRestWS/SieteRestWS.ashx}
app.uf.bcentral-user=${BCENTRAL_USER:}
app.uf.bcentral-pass=${BCENTRAL_PASS:}
#  Todos los dias a las 9:30 de Chile.
app.uf.cron=${UF_CRON:0 30 9 * * *}

# ---- Transbank Webpay Plus -------------------------------------------------------
#  Cobra de verdad, en el ambiente de integracion (TEST): el deudor paga en la
#  pagina de Webpay con una tarjeta de prueba. El codigo de comercio y la llave
#  de abajo NO son secretos: Transbank los publica para que cualquiera pruebe
#  sin registrarse. En produccion se reemplazan por los del comercio, con
#  TRANSBANK_API_URL=https://webpay3g.transbank.cl. TRANSBANK_ENVIRONMENT=SIMULADA
#  vuelve a la pasarela simulada, sin internet.
app.transbank.url=${TRANSBANK_API_URL:https://webpay3gint.transbank.cl}
app.transbank.commerce-code=${TRANSBANK_COMMERCE_CODE:597055555532}
app.transbank.api-key=${TRANSBANK_API_KEY:579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}
app.transbank.environment=${TRANSBANK_ENVIRONMENT:TEST}
#  Un cobro de Webpay abierto mas de esto se da por abandonado (Transbank anula
#  el token a los pocos minutos). Se revisa cada 5 minutos.
app.transbank.vence-en=${TRANSBANK_VENCE_EN:15m}

# ---- Mercado Pago (Checkout Pro) -------------------------------------------
#  Con MERCADOPAGO_ACCESS_TOKEN, Mercado Pago cobra de verdad: el deudor paga
#  en la pasarela de Mercado Pago. Se usan credenciales de prueba por omision;
#  el access token es un SECRETO y en produccion va solo en el .env.
#  Ojo con app.public-url: Mercado Pago descarta en silencio las direcciones de
#  vuelta que no son https. Con http://localhost el deudor paga pero no vuelve
#  solo al portal, y el pago se concilia contra la preferencia. Con un tunel
#  https la vuelta automatica funciona.
app.mercadopago.url=${MERCADOPAGO_URL:https://api.mercadopago.com}
app.mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:APP_USR-0e4b2202-9b14-4b4b-9696-28802be3048a}
app.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:APP_USR-8079701943220387-100401-c35823cb3e6ca0dd24d21af811de65b4-3737969390}
app.mercadopago.environment=${MERCADOPAGO_ENVIRONMENT:TEST}

# ---- Salud y documentacion ----------------------------------------------------
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
app.openapi.url-interna=${OPENAPI_URL_INTERNA:http://localhost:8084}

logging.level.com.tbridge=INFO
